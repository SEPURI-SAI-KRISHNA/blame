[project]
name = "pandas-blame"
version = "0.1.0"
description = "Cell-level why, time-travel and run-diff for pandas pipelines. No code changes."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "blame contributors" }]
keywords = ["pandas", "lineage", "provenance", "debugging", "dataframe", "data-quality"]
dependencies = ["pandas>=2.0", "pyarrow>=14", "numpy>=1.24"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Debuggers",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/SEPURI-SAI-KRISHNA/blame"
Source = "https://github.com/SEPURI-SAI-KRISHNA/blame"
Issues = "https://github.com/SEPURI-SAI-KRISHNA/blame/issues"

[project.scripts]
blame = "blame.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blame"]
artifacts = ["src/blame/_ui/*.html"]   # the UI page, served by `blame ui`

[tool.hatch.build.targets.sdist]
include = ["src/blame", "tests", "examples", "bench", "docs", "README.md", "ROADMAP.md", "LICENSE"]
