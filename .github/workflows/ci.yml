name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday morning: a tracer that monkeypatches pandas should hear about a
    # new pandas release from CI, not from a user's bug report.
    #
    # Every job carries `if: github.event_name != 'schedule' || github.repository
    # == '<this repo>'`. A cron is inherited by every fork, and without that
    # guard each one burns its owner's Actions minutes weekly without them ever
    # asking for it. A fork's own pushes and pull requests still build.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  # Keyed on the PR number where there is one, so two pushes to the same PR
  # collapse but a push to main and a PR from that same branch do not.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseding a PR push is right; superseding a push to main is not. That
  # cancels the build of a commit that is now main, and the record of it is the
  # thing you want to point at later.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing here writes to the repo. Stated explicitly so a change to the
# organisation-wide default cannot silently widen it.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'schedule' || github.repository == 'SEPURI-SAI-KRISHNA/blame'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uvx ruff check --output-format=github .
      - run: uvx ruff format --check --diff .

  typecheck:
    # The package ships a py.typed marker, so its annotations are a promise to
    # every downstream type checker. This is what makes that promise honest.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'schedule' || github.repository == 'SEPURI-SAI-KRISHNA/blame'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: Install
        run: |
          uv venv --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          uv pip install -e . mypy pandas-stubs
      - run: mypy

      - name: A downstream project must actually get type checking
        # Guards the failure this job was added for: the marker shipped while
        # trace() returned an untyped value, so every check a caller wrote
        # against it passed vacuously.
        run: |
          mkdir -p /tmp/downstream && cd /tmp/downstream
          printf '[mypy]\n' > mypy.ini
          cat > wrong.py <<'PY'
          import blame
          import pandas as pd

          with blame.trace() as h:
              df = pd.DataFrame({"v": [1, 2, 3]})
              out = df[df.v > 1]

          h.run.why(row="not-an-int")
          h.run.nosuchmethod()
          PY
          if mypy --no-incremental --config-file=mypy.ini wrong.py; then
            echo "::error::downstream type checking found nothing; py.typed is not delivering"
            exit 1
          fi
          echo "downstream type checking works"

  test:
    name: pandas ${{ matrix.pandas || 'latest' }} / py ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name != 'schedule' || github.repository == 'SEPURI-SAI-KRISHNA/blame'
    strategy:
      fail-fast: false
      matrix:
        # Only combinations that can exist: pandas 2.0 predates numpy 2, and
        # pandas 3.0 requires Python 3.11 or newer.
        include:
          - {python: "3.10", pandas: "2.0.3", extra: "numpy<2"}
          - {python: "3.11", pandas: "2.0.3", extra: "numpy<2"}
          - {python: "3.10", pandas: "2.2.3", extra: ""}
          - {python: "3.12", pandas: "2.2.3", extra: ""}
          - {python: "3.11", pandas: "3.0.5", extra: ""}
          - {python: "3.12", pandas: "3.0.5", extra: ""}
          - {python: "3.13", pandas: "3.0.5", extra: ""}
          # Unpinned: catches a new pandas release before users do.
          - {python: "3.12", pandas: "", extra: ""}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install
        run: |
          uv venv --python ${{ matrix.python }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          uv pip install -e ".[dev]" matplotlib
          if [ -n "${{ matrix.pandas }}" ]; then
            uv pip install "pandas==${{ matrix.pandas }}"
          fi
          if [ -n "${{ matrix.extra }}" ]; then
            uv pip install "${{ matrix.extra }}"
          fi

      - name: Versions under test
        run: |
          python -c "import sys, pandas, numpy, pyarrow; print(sys.version); print('pandas', pandas.__version__, '| numpy', numpy.__version__, '| pyarrow', pyarrow.__version__)"

      - name: Test
        env:
          MPLBACKEND: Agg
        run: python -m pytest

  sdist:
    # Downstream packagers -- Debian, conda-forge, Homebrew, Nix -- build from
    # the sdist and run its test suite during the build. Every other job here
    # runs from a full checkout, where .github/ and the community files exist,
    # so this is the only place a suite that cannot pass from an sdist shows up.
    #
    # It also guards a second regression for free: the unpacked directory is
    # named pandas_blame-<version>, which contains the string "pandas". That is
    # exactly the condition that once made the tracer record nothing at all.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'schedule' || github.repository == 'SEPURI-SAI-KRISHNA/blame'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv build --sdist

      - name: Unpack the sdist and run its own suite
        env:
          MPLBACKEND: Agg
        run: |
          mkdir -p /tmp/sd
          tar xzf dist/*.tar.gz -C /tmp/sd
          cd /tmp/sd/pandas_blame-*/
          pwd   # contains "pandas": the bug this also guards
          uv venv --python 3.12
          VIRTUAL_ENV=$PWD/.venv uv pip install -e ".[dev]" matplotlib
          ./.venv/bin/python -m pytest -q

  floor:
    # requires-python and the dependency lower bounds are claims. This is the
    # job that checks them, rather than trusting whatever pip happens to resolve.
    name: dependency floor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'schedule' || github.repository == 'SEPURI-SAI-KRISHNA/blame'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install the declared minimums
        run: |
          uv venv --python 3.10
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          uv pip install "pandas==2.0.0" "numpy==1.24.0" "pyarrow==14.0.0"
          uv pip install --no-deps -e .
          uv pip install pytest matplotlib "tomli>=2"

      - name: Versions under test
        run: python -c "import sys, pandas, numpy, pyarrow; print(sys.version); print('pandas', pandas.__version__, '| numpy', numpy.__version__, '| pyarrow', pyarrow.__version__)"

      - name: Test
        env:
          MPLBACKEND: Agg
        run: python -m pytest

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'schedule' || github.repository == 'SEPURI-SAI-KRISHNA/blame'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv build
      - run: uvx twine check --strict dist/*

      - name: The wheel must work on its own
        run: |
          uv venv /tmp/wheelcheck
          VIRTUAL_ENV=/tmp/wheelcheck uv pip install dist/*.whl
          /tmp/wheelcheck/bin/python - <<'PY'
          import pandas as pd

          import blame

          df = pd.DataFrame({"a": [1, 2, 3, 4], "b": [10.0, 20, 30, 40]})
          with blame.trace(root="/tmp/ci-blame") as handle:
              kept = df[df.a > 1]
              out = kept.groupby("a", as_index=False)["b"].sum()

          rows = handle.run.why(row=0, target=out).sources[handle.run.sources[0]]
          assert rows.tolist() == [1], rows

          from blame.ui import _ASSET
          assert _ASSET.exists(), "the UI page is missing from the wheel"
          print("wheel ok")
          PY
          /tmp/wheelcheck/bin/blame --root /tmp/ci-blame steps

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
