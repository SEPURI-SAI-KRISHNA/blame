[project]
name = "blame"
version = "0.1.0"
description = "Cell-level why, time-travel and run-diff for pandas pipelines. No code changes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "pyarrow>=14", "numpy>=1.24"]

[project.scripts]
blame = "blame.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blame"]
artifacts = ["src/blame/_ui/*.html"]   # the UI page, served by `blame ui`
