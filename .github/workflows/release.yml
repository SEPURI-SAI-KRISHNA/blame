name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: The tag must match the version being published
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(ls dist/*.tar.gz | sed -E 's/.*pandas_blame-(.+)\.tar\.gz/\1/')
          test "$TAG" = "$PKG" || { echo "tag $TAG != package $PKG"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # trusted publishing: no API token stored anywhere
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
