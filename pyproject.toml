[project]
name = "pandas-blame"
version = "0.1.3"
description = "Cell-level why, time-travel and run-diff for pandas pipelines. No code changes."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "blame contributors" }]
keywords = ["pandas", "lineage", "provenance", "debugging", "dataframe", "data-quality"]
dependencies = ["pandas>=2.0", "pyarrow>=23.0.1", "numpy>=1.24"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Debuggers",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/SEPURI-SAI-KRISHNA/blame"
Source = "https://github.com/SEPURI-SAI-KRISHNA/blame"
Issues = "https://github.com/SEPURI-SAI-KRISHNA/blame/issues"
Changelog = "https://github.com/SEPURI-SAI-KRISHNA/blame/blob/main/CHANGELOG.md"

[project.scripts]
blame = "blame.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "tomli>=2; python_version<'3.11'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blame"]
artifacts = ["src/blame/_ui/*.html"]   # the UI page, served by `blame ui`

[tool.hatch.build.targets.sdist]
include = [
    "src/blame", "tests", "examples", "bench", "docs", "validation",
    "README.md", "ROADMAP.md", "CHANGELOG.md", "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md", "SECURITY.md", "SUPPORT.md", "LICENSE",
]

[tool.check-sdist]
# Everything git tracks has to be in the sdist, except the things that are
# meaningless outside a git checkout. This list is the whole exception.
git-only = [
    ".git-blame-ignore-revs",  # read by `git blame`, by nothing else
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "BLE"]
ignore = [
    "E501",    # long lines are a judgement call, not an error
    "RUF015",  # `[x for x in y][0]` fails loudly on empty; `next()` needs a default
    "SIM105",  # contextlib.suppress hides which exception is being tolerated
    "SIM108",  # a ternary is not always clearer than an if
]

[tool.ruff.lint.per-file-ignores]
# The tracer's second rule is that it never raises: if lineage cannot be derived
# it degrades and keeps going, because a debugging tool must not break the
# pipeline it is watching. Broad excepts there are the design, not an oversight.
"src/blame/_tracer.py" = ["BLE001"]
"src/blame/ui.py" = ["BLE001"]
"src/blame/diff.py" = ["BLE001"]
"src/blame/query.py" = ["BLE001"]
"tests/*" = ["F841"]
"bench/*" = ["B023"]

[tool.mypy]
files = ["src/blame"]
# No python_version pin: numpy's bundled stubs use 3.12 syntax and fail to parse
# under an older setting. Runtime compatibility with 3.10 is what the test
# matrix proves; this checks the annotations.
# The package ships a py.typed marker, so these annotations are a promise to
# every downstream type checker. Checking them here is what makes that honest.
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = true
# Without this mypy skips the body of every unannotated function, and most of
# this package is unannotated -- it reported "Success" while checking a
# fraction of the code, and five real errors were sitting behind that.
check_untyped_defs = true

[[tool.mypy.overrides]]
# pyarrow ships neither stubs nor a py.typed marker.
module = ["pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = [
    # Deprecations are errors on purpose: a library that monkeypatches pandas
    # wants to hear about a pandas deprecation from its own CI, not from a user.
    "error::DeprecationWarning",
    "error::FutureWarning",
    "default::UserWarning",
    # pandas 2.2 predates numpy 2.5 and trips this from inside timedeltas.pyx.
    # Nothing we can act on, and it fires before any of our code runs.
    "ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning",
]
