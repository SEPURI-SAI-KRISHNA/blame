name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: The tag must match the version being published
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(ls dist/*.tar.gz | sed -E 's/.*pandas_blame-(.+)\.tar\.gz/\1/')
          test "$TAG" = "$PKG" || { echo "tag $TAG != package $PKG"; exit 1; }
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write        # trusted publishing: no API token stored anywhere
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/
      # Pinned to an exact release tag, not a digest. This action runs a Docker
      # container pulled from ghcr.io/pypa/gh-action-pypi-publish:<this ref>,
      # and only release tags are published there -- a commit SHA gives
      # "manifest unknown". So an exact tag is the tightest pin available, and
      # it still avoids the moving release/v1.
      - uses: pypa/gh-action-pypi-publish@v1.14.2
