name: Bug Report
description: blame gave the wrong answer, no answer, or crashed
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This is the report I most want. `blame` has only ever been run on its
        own tests and the pandas documentation tutorials — if it gets something
        wrong about a real pipeline, that is the interesting case.

        **A silent wrong answer matters more than a crash.** Every bug found so
        far has been one: no exception, no warning, just lineage that was absent
        or invented. If something looks merely odd, it is still worth reporting.
  - type: checkboxes
    id: prechecks
    attributes:
      label: Before reporting
      options:
        - label: I searched [existing issues](https://github.com/SEPURI-SAI-KRISHNA/blame/issues?q=is%3Aissue) for this
          required: true
        - label: I am on the latest release (`blame --version` against [PyPI](https://pypi.org/project/pandas-blame/))
          required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did blame say, and what should it have said?
      placeholder: |
        why() reported rows [3, 7] of orders.csv, but row 7 has nothing to do
        with that total — it is filtered out two steps earlier.
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: The smallest pipeline that shows it
      description: >
        Runnable code, with made-up data if the real data is private. A
        DataFrame literal is ideal. This is the single thing that most affects
        how fast it gets fixed.
      render: python
      placeholder: |
        import blame, pandas as pd

        df = pd.DataFrame({"a": [1, 2, 3], "b": [10.0, 20, 30]})
        with blame.trace() as h:
            out = df[df.a > 1].groupby("a", as_index=False)["b"].sum()
        print(h.run.why(row=0, target=out))
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: Output of `run.table()`
      description: >
        The operations blame recorded. Paste it as-is — a step that is missing,
        or one that appears twice, is often the whole answer.
      render: text
  - type: dropdown
    id: environment
    attributes:
      label: How was the code running?
      description: >
        Asked because every bug found so far has depended on this. Tracing
        inspects the call stack to tell your code from pandas' internals, and
        what that stack looks like differs between a script, a notebook and a
        worker thread.
      options:
        - A .py script
        - A Jupyter or IPython notebook
        - An interactive REPL
        - Inside pytest
        - A web app, task queue, or other long-running service
        - Something else (described above)
    validations: {required: true}
  - type: dropdown
    id: threads
    attributes:
      label: Was anything else using pandas at the same time?
      description: >
        Other threads, a ThreadPoolExecutor, joblib or Dask with a threading
        backend. Say "not sure" if you do not know — that is a useful answer.
      options:
        - "No, single-threaded"
        - "Yes, other threads were using pandas"
        - Not sure
    validations: {required: true}
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Windows (WSL)
    validations: {required: true}
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: "Run: `python -c \"import blame, pandas, numpy, pyarrow, sys; print(sys.version); print(blame.__version__, pandas.__version__, numpy.__version__, pyarrow.__version__)\"`"
      render: text
    validations: {required: true}
  - type: checkboxes
    id: approximate
    attributes:
      label: Did blame flag the step as approximate?
      description: >
        A `~` in `run.table()`, or `Explanation.approximate == True`. An answer
        that is approximate *and says so* is working as designed — widened, not
        wrong. An answer that is wrong and claims to be exact is a real bug.
      options:
        - label: The step was marked approximate (`~`)
        - label: No approximate flag — blame claimed this answer was exact
