name: Feature request
description: Something blame should be able to do, other than tracing a new pandas operation
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For "blame does not trace `DataFrame.explode`", use **Unsupported pandas
        operation** instead — that is a different and usually smaller job.

        Worth reading [ROADMAP.md](https://github.com/SEPURI-SAI-KRISHNA/blame/blob/main/ROADMAP.md)
        first; it says what is deliberately out of scope and why.
  - type: textarea
    id: problem
    attributes:
      label: The problem you hit
      description: >
        What were you trying to find out about your pipeline, and where did
        blame stop being useful? Describe the situation rather than the feature
        — the best version of the feature often is not the one first imagined.
    validations: {required: true}
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Optional. An API sketch is welcome but not required.
      render: python
  - type: textarea
    id: workaround
    attributes:
      label: What you do instead today
      description: >
        Including "print statements" — knowing what the feature would replace
        says a lot about how much it is worth.
