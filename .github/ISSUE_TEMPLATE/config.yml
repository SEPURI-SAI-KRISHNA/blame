blank_issues_enabled: false
contact_links:
  - name: Question, idea, or "is this supposed to work?"
    url: https://github.com/SEPURI-SAI-KRISHNA/blame/discussions
    about: >
      Anything that is not a defect report. Usage questions are welcome and are
      often the fastest way to find out that something is a bug after all.
  - name: Security vulnerability
    url: https://github.com/SEPURI-SAI-KRISHNA/blame/security/policy
    about: >
      Report privately. `blame` reads your data and writes it to .blame/, so
      please do not open a public issue for anything with a disclosure risk.
  - name: What counts as exact, and what does not
    url: https://github.com/SEPURI-SAI-KRISHNA/blame/blob/main/docs/accuracy.md
    about: >
      Before reporting a wrong answer, worth checking whether the operation is
      one blame traces exactly. Approximate answers are widened on purpose.
