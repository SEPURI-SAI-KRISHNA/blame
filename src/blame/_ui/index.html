<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blame</title>
<style>
  :root {
    --bg: #fbfbfa;  --panel: #ffffff;  --ink: #1c1c1a;  --dim: #7a7a74;
    --line: #e2e1dd;  --line-strong: #c9c8c2;
    --mark: #f6c945;  --mark-soft: #fdf3d0;  --mark-ink: #6b4e00;
    --warn: #b4531a;  --accent: #2f6f4f;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a;  --panel: #1d1f23;  --ink: #e6e5e1;  --dim: #8d8d87;
      --line: #2c2f34;  --line-strong: #3d4147;
      --mark: #d8a72b;  --mark-soft: #3a3117;  --mark-ink: #f3d894;
      --warn: #e08a4d;  --accent: #6cba8f;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 13px/1.5 var(--mono);
    display: grid; grid-template-rows: auto 1fr; overflow: hidden;
  }

  header {
    display: flex; align-items: baseline; gap: 14px;
    padding: 9px 14px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header .mark { font-weight: 700; letter-spacing: .04em; }
  header .sub { color: var(--dim); font-size: 12px; }
  header .spacer { flex: 1; }
  label.toggle { color: var(--dim); font-size: 12px; cursor: pointer; user-select: none; }

  main { display: grid; grid-template-columns: 384px 1fr; min-height: 0; }
  #left {
    border-right: 1px solid var(--line); min-height: 0;
    display: grid; grid-template-rows: 1fr auto; background: var(--panel);
  }
  #dagwrap { overflow: auto; padding: 14px; min-height: 0; }
  #dag { position: relative; }
  #edges { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
  #edges path { fill: none; stroke: var(--line-strong); stroke-width: 1.4; }
  #edges path.lit { stroke: var(--mark); stroke-width: 2.2; }

  .node {
    position: absolute; padding: 7px 9px;
    border: 1px solid var(--line-strong); border-radius: 5px; background: var(--bg);
    cursor: pointer; overflow: hidden; transition: opacity .12s, border-color .12s;
  }
  .node:hover { border-color: var(--ink); }
  .node .lbl { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node .meta { color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node.current { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .node.marked { background: var(--mark-soft); border-color: var(--mark); }
  .node.dim { opacity: .32; }
  .node .badge {
    position: absolute; top: 6px; right: 7px; font-size: 10.5px;
    background: var(--mark); color: var(--mark-ink); border-radius: 8px; padding: 1px 6px; font-weight: 700;
  }
  .node .approx { color: var(--warn); font-weight: 700; }

  #detail { border-top: 1px solid var(--line); max-height: 42vh; overflow: auto; padding: 11px 14px; }
  #detail h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
               color: var(--dim); margin: 0 0 7px; font-weight: 600; }
  #detail .empty { color: var(--dim); }
  #detail .warn { color: var(--warn); margin-bottom: 8px; }
  .hop, .src { padding: 3px 6px; border-radius: 4px; cursor: pointer; border-left: 2px solid transparent; }
  .hop:hover, .src:hover { background: var(--mark-soft); border-left-color: var(--mark); }
  .hop .op { font-weight: 600; }
  .hop .loc, .hop .from { color: var(--dim); font-size: 11.5px; }
  .src .n { color: var(--accent); font-weight: 600; }
  #detail hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }

  #right { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
  #bar {
    display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap;
  }
  #bar .title { font-weight: 600; }
  #bar .shape, #bar .range { color: var(--dim); font-size: 12px; }
  #bar .spacer { flex: 1; }
  button {
    font: inherit; font-size: 12px; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line-strong); border-radius: 4px; padding: 2px 9px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--ink); }
  button:disabled { opacity: .4; cursor: default; }

  #gridwrap { overflow: auto; min-height: 0; }
  table { border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
  th, td { padding: 3px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; text-align: left; }
  thead th {
    position: sticky; top: 0; z-index: 2; background: var(--panel);
    border-bottom: 1px solid var(--line-strong); font-weight: 600; color: var(--dim);
  }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.pos, th.pos { color: var(--dim); text-align: right; background: var(--panel);
                   position: sticky; left: 0; z-index: 1; border-right: 1px solid var(--line); }
  thead th.pos { z-index: 3; }
  td.na { color: var(--dim); font-style: italic; }
  tr.marked td { background: var(--mark-soft); }
  tr.marked td.pos { background: var(--mark-soft); box-shadow: inset 2px 0 0 var(--mark); color: var(--mark-ink); }
  td { cursor: pointer; }
  td.sel { outline: 2px solid var(--accent); outline-offset: -2px; }
  tr.marked td.sel { background: var(--mark); color: var(--mark-ink); }
  .note { padding: 12px 14px; color: var(--dim); }
  .banner { padding: 7px 14px; color: var(--warn); border-bottom: 1px solid var(--line); font-size: 12px; }
</style>
</head>
<body>
<header>
  <span class="mark">blame</span>
  <span class="sub" id="summary">loading…</span>
  <span class="spacer"></span>
  <label class="toggle"><input type="checkbox" id="internal"> internal steps</label>
</header>

<main>
  <div id="left">
    <div id="dagwrap"><div id="dag"><svg id="edges"></svg></div></div>
    <div id="detail"><h2>derivation</h2><div class="empty">click any cell to see what made it</div></div>
  </div>
  <div id="right">
    <div id="bar">
      <span class="title" id="ftitle">—</span>
      <span class="shape" id="fshape"></span>
      <span class="spacer"></span>
      <span class="range" id="frange"></span>
      <button id="prev">prev</button>
      <button id="next">next</button>
      <button id="clear">clear</button>
    </div>
    <div id="gridwrap"><div class="note">loading…</div></div>
  </div>
</main>

<script>
const $ = (s) => document.querySelector(s);
const NODE_H = 50, ROW = 86;
let NODE_W = 200;

let RUN = null, BY_OUT = {}, FID = null, PAGE = null;
let MARKS = {}, SEL = null, INTERNAL = false, LAYOUT = {};

async function api(path) {
  const res = await fetch(path);
  const body = await res.json();
  if (body.error) throw new Error(body.error);
  return body;
}

// ---- structure -----------------------------------------------------------

const visible = (fid) => { const s = BY_OUT[fid]; return !s || !s.minor || INTERNAL; };

function visibleParents(fid) {
  const step = BY_OUT[fid];
  if (!step) return [];
  const out = [], seen = new Set();
  const walk = (f) => {
    if (seen.has(f)) return;
    seen.add(f);
    if (visible(f)) { out.push(f); return; }
    const p = BY_OUT[f];
    if (!p) { out.push(f); return; }
    p.inputs.forEach(walk);
  };
  step.inputs.forEach(walk);
  return out;
}

function layout() {
  const nodes = Object.keys(RUN.nodes).filter(visible);
  const depth = {}, order = {};
  nodes.forEach((f, i) => order[f] = BY_OUT[f] ? BY_OUT[f].idx : -1000 + i);
  const depthOf = (f, guard) => {
    if (depth[f] !== undefined) return depth[f];
    if (guard.has(f)) return 0;
    guard.add(f);
    const ps = visibleParents(f).filter(visible);
    depth[f] = ps.length ? 1 + Math.max(...ps.map((p) => depthOf(p, guard))) : 0;
    guard.delete(f);
    return depth[f];
  };
  nodes.forEach((f) => depthOf(f, new Set()));

  const layers = {};
  nodes.sort((a, b) => order[a] - order[b]).forEach((f) => (layers[depth[f]] ||= []).push(f));
  const widest = Math.max(1, ...Object.values(layers).map((l) => l.length));

  // the panel sizes itself to the graph: a linear pipeline stays narrow, a
  // branching one widens up to half the window rather than scrolling sideways
  const panel = Math.max(320, Math.min(Math.floor(innerWidth * 0.46), widest * 180 + 40));
  document.querySelector("main").style.gridTemplateColumns = panel + "px 1fr";
  // measured after the panel resizes, so a vertical scrollbar is accounted for
  const avail = Math.max(200, $("#dagwrap").clientWidth - 28);
  NODE_W = Math.max(120, Math.min(248, Math.floor(avail / widest) - 16));
  const span = Math.max(avail, widest * (NODE_W + 16));

  const pos = {};
  for (const [d, layer] of Object.entries(layers)) {
    layer.forEach((f, i) => {
      pos[f] = { x: (span / layer.length) * (i + 0.5) - NODE_W / 2, y: +d * ROW };
    });
  }
  return { nodes, pos, w: span, h: (Math.max(0, ...Object.values(depth)) + 1) * ROW };
}

function renderDag() {
  LAYOUT = layout();
  const dag = $("#dag"), svg = $("#edges");
  dag.style.width = LAYOUT.w + "px";
  dag.style.height = LAYOUT.h + "px";
  svg.setAttribute("width", LAYOUT.w);
  svg.setAttribute("height", LAYOUT.h);
  [...dag.querySelectorAll(".node")].forEach((n) => n.remove());

  const paths = [];
  for (const fid of LAYOUT.nodes) {
    const to = LAYOUT.pos[fid];
    for (const p of visibleParents(fid)) {
      const from = LAYOUT.pos[p];
      if (!from) continue;
      const x1 = from.x + NODE_W / 2, y1 = from.y + NODE_H;
      const x2 = to.x + NODE_W / 2, y2 = to.y;
      const lit = MARKS[p] && MARKS[fid] ? " lit" : "";
      paths.push(`<path class="edge${lit}" d="M${x1},${y1} C${x1},${y1 + 34} ${x2},${y2 - 34} ${x2},${y2}"/>`);
    }
  }
  svg.innerHTML = paths.join("");

  const anyMarks = Object.keys(MARKS).length > 0;
  for (const fid of LAYOUT.nodes) {
    const node = RUN.nodes[fid], step = BY_OUT[fid], p = LAYOUT.pos[fid];
    const mark = MARKS[fid];
    const el = document.createElement("div");
    el.className = "node"
      + (fid === FID ? " current" : "")
      + (mark ? " marked" : anyMarks ? " dim" : "");
    el.style.left = p.x + "px";
    el.style.top = p.y + "px";
    el.style.width = NODE_W + "px";
    const op = step
      ? `${esc(step.op)}${step.detail ? "(" + esc(clip(step.detail, Math.floor(NODE_W / 8) - 6)) + ")" : "()"}`
      : "source";
    el.innerHTML =
      `<div class="lbl">${esc(node.label)}${step && step.approximate ? ' <span class="approx">~</span>' : ""}</div>` +
      `<div class="meta">${op} · ${node.nrows}×${node.ncols}</div>` +
      (mark ? `<span class="badge">${mark.n}</span>` : "");
    el.title = step ? `step ${step.idx}: ${step.op}(${step.detail})\n${step.loc}` : `source: ${node.label}`;
    el.onclick = () => showFrame(fid);
    dag.appendChild(el);
  }
}

// ---- grid ----------------------------------------------------------------

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clip = (s, n) => (String(s).length > n ? String(s).slice(0, n - 1) + "…" : String(s));

function fmt(v, decimals) {
  if (v === null || v === undefined) return null;
  if (typeof v === "number" && !Number.isInteger(v)) {
    const a = Math.abs(v);
    if (a !== 0 && (a < 1e-4 || a >= 1e10)) return v.toExponential(3);
    return decimals >= 0 ? v.toFixed(decimals) : String(Number(v.toFixed(6)));
  }
  if (typeof v === "number" && decimals > 0) return v.toFixed(decimals);
  return String(v);
}

function decimalsFor(rows, j) {
  let d = 0;
  for (const row of rows) {
    const v = row[j];
    if (typeof v !== "number" || !Number.isFinite(v) || Number.isInteger(v)) continue;
    const text = String(v);
    if (text.includes("e")) return -1;         // extreme values: format each on its own
    d = Math.max(d, (text.split(".")[1] || "").length);
    if (d >= 6) return 6;
  }
  return d;
}

async function showFrame(fid, offset) {
  FID = fid;
  if (offset === undefined) {
    const mark = MARKS[fid];
    const first = mark && mark.rows.length ? mark.rows[0] : 0;
    offset = Math.floor(first / RUN.page_rows) * RUN.page_rows;
  }
  PAGE = await api(`/api/frame?fid=${encodeURIComponent(fid)}&offset=${offset}&limit=${RUN.page_rows}`);
  renderGrid();
  renderDag();
  syncLink();
}

function renderGrid() {
  if (!PAGE) return;              // a deep link asks before the first page loads
  const p = PAGE, node = RUN.nodes[p.fid], step = BY_OUT[p.fid];
  $("#ftitle").textContent = p.label;
  $("#fshape").textContent = step
    ? `· step ${step.idx} ${step.op}(${clip(step.detail, 44)}) · ${p.declared_rows}×${node.ncols}${step.loc ? " · " + step.loc : ""}`
    : `· source · ${p.declared_rows}×${node.ncols}`;

  const shown = p.rows.length, last = p.offset + shown;
  $("#frange").textContent = shown ? `rows ${p.offset}–${last - 1} of ${p.nrows}` : "no rows";
  $("#prev").disabled = p.offset <= 0;
  $("#next").disabled = last >= p.nrows;

  const marked = new Set((MARKS[p.fid] || { rows: [] }).rows);
  const banners = [];
  if (p.sampled) banners.push(`this frame was sampled at capture: ${p.sampled[0]} of ${p.sampled[1]} rows are stored`);
  if (p.unavailable.length) banners.push(`columns not reconstructible: ${p.unavailable.join(", ")}`);
  const m = MARKS[p.fid];
  if (m && m.truncated) banners.push(`${m.n} rows match; only the first ${m.rows.length} are highlighted`);

  const decimals = p.columns.map((_, j) => (p.numeric[j] ? decimalsFor(p.rows, j) : -1));

  let head = '<th class="pos">#</th>' + (p.index ? "<th>index</th>" : "");
  head += p.columns.map((c) => `<th>${esc(c)}</th>`).join("");

  const body = p.rows.map((row, i) => {
    const pos = p.offset + i;
    const cells = row.map((v, j) => {
      const text = fmt(v, decimals[j]);
      const cls = [p.numeric[j] ? "num" : "", text === null ? "na" : "",
        SEL && SEL.fid === p.fid && SEL.row === pos && SEL.col === p.columns[j] ? "sel" : ""]
        .filter(Boolean).join(" ");
      return `<td class="${cls}" data-row="${pos}" data-col="${esc(p.columns[j])}">${text === null ? "NA" : esc(text)}</td>`;
    }).join("");
    const idx = p.index ? `<td data-row="${pos}">${esc(fmt(p.index[i], -1) ?? "NA")}</td>` : "";
    const selRow = SEL && SEL.fid === p.fid && SEL.row === pos && !SEL.col ? " sel" : "";
    return `<tr class="${marked.has(pos) ? "marked" : ""}">`
      + `<td class="pos${selRow}" data-row="${pos}">${pos}</td>${idx}${cells}</tr>`;
  }).join("");

  $("#gridwrap").innerHTML =
    banners.map((b) => `<div class="banner">! ${esc(b)}</div>`).join("")
    + (shown ? `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`
             : `<div class="note">this frame has no rows</div>`);

  $("#gridwrap").querySelectorAll("td").forEach((td) => {
    td.onclick = () => ask(p.fid, +td.dataset.row, td.dataset.col || null);
  });
  const first = $("#gridwrap tr.marked");
  if (first && (!SEL || SEL.fid !== p.fid)) first.scrollIntoView({ block: "center" });
}

// ---- the question --------------------------------------------------------

async function ask(fid, row, col) {
  SEL = { fid, row, col };
  syncLink();
  const q = `/api/why?fid=${encodeURIComponent(fid)}&rows=${row}` + (col ? `&col=${encodeURIComponent(col)}` : "");
  const answer = await api(q);
  MARKS = answer.marks;
  renderDetail(answer);
  renderGrid();
  renderDag();
}

function syncLink() {
  if (!SEL) { history.replaceState(null, "", location.pathname); return; }
  const parts = [SEL.fid, SEL.row, SEL.col ? encodeURIComponent(SEL.col) : ""];
  if (FID && FID !== SEL.fid) parts.push(FID);
  history.replaceState(null, "", "#" + parts.join("/").replace(/\/+$/, ""));
}

function renderDetail(a) {
  const target = RUN.nodes[a.fid];
  const cell = a.col ? `, ${esc(a.col)}` : "";
  const parts = [`<h2>why(${esc(target.label)} · row ${a.rows.join(", ")}${cell})</h2>`];
  if (a.approximate) {
    parts.push('<div class="warn">! this path crosses an approximate step &mdash; treat these rows as candidates</div>');
  }
  if (!a.hops.length) {
    parts.push('<div class="empty">this frame is a source; nothing produced it</div>');
  }
  for (const h of a.hops) {
    const from = Object.entries(h.contributions)
      .map(([f, n]) => `${esc(RUN.nodes[f] ? RUN.nodes[f].label : f)}:${n}`).join(", ");
    parts.push(
      `<div class="hop" data-fid="${h.step >= 0 ? esc(RUN.steps[h.step].output) : ""}">` +
      `<span class="op">${h.step} ${esc(h.op)}(${esc(clip(h.detail, 30))})</span>` +
      (h.approximate ? ' <span class="approx" style="color:var(--warn)">~</span>' : "") +
      `<div class="from">← ${from || "—"}${h.loc ? ' <span class="loc">' + esc(h.loc) + "</span>" : ""}</div></div>`);
  }
  parts.push("<hr><h2>source rows</h2>");
  for (const [fid, s] of Object.entries(a.sources)) {
    const label = RUN.nodes[fid] ? RUN.nodes[fid].label : fid;
    const preview = s.rows.slice(0, 12).join(", ") + (s.n > 12 ? `, +${s.n - 12}` : "");
    parts.push(`<div class="src" data-fid="${esc(fid)}"><span class="n">${s.n}</span> `
      + `row${s.n === 1 ? "" : "s"} of <b>${esc(label)}</b><div class="from">[${preview}]</div></div>`);
  }
  const box = $("#detail");
  box.innerHTML = parts.join("");
  box.querySelectorAll("[data-fid]").forEach((el) => {
    if (el.dataset.fid) el.onclick = () => showFrame(el.dataset.fid);
  });
}

function clearSelection() {
  MARKS = {}; SEL = null;
  history.replaceState(null, "", location.pathname);
  $("#detail").innerHTML = '<h2>derivation</h2><div class="empty">click any cell to see what made it</div>';
  renderGrid();
  renderDag();
}

// ---- boot ----------------------------------------------------------------

$("#prev").onclick = () => showFrame(FID, Math.max(0, PAGE.offset - RUN.page_rows));
$("#next").onclick = () => showFrame(FID, PAGE.offset + RUN.page_rows);
$("#clear").onclick = clearSelection;
$("#internal").onchange = (e) => { INTERNAL = e.target.checked; renderDag(); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") clearSelection(); });

let resizeTimer = null;
addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => RUN && renderDag(), 120);
});

(async () => {
  RUN = await api("/api/run");
  RUN.steps.forEach((s) => (BY_OUT[s.output] = s));
  document.title = RUN.label ? `blame · ${RUN.label}` : "blame";
  $("#summary").textContent = RUN.summary + (RUN.warnings.length ? `  ·  ${RUN.warnings.length} warning(s)` : "");
  if (RUN.warnings.length) $("#summary").title = RUN.warnings.join("\n");
  renderDag();

  const link = location.hash.slice(1).split("/").map(decodeURIComponent);
  if (link.length >= 2 && RUN.nodes[link[0]]) {
    await ask(link[0], +link[1], link[2] || null);
    await showFrame(RUN.nodes[link[3]] ? link[3] : link[0]);
  } else {
    await showFrame(RUN.result, 0);
  }
})().catch((e) => { $("#gridwrap").innerHTML = `<div class="note">${esc(e.message)}</div>`; });
</script>
</body>
</html>
