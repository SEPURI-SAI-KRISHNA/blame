name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday morning: a tracer that monkeypatches pandas should hear about a
    # new pandas release from CI, not from a user's bug report.
    #
    # Every job carries `if: github.event_name != 'schedule' || github.repository
    # == '<this repo>'`. A cron is inherited by every fork, and without that
    # guard each one burns its owner's Actions minutes weekly without them ever
    # asking for it. A fork's own pushes and pull requests still build.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  # Keyed on the PR number where there is one, so two pushes to the same PR
  # collapse but a push to main and a PR from that same branch do not.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseding a PR push is right; superseding a push to main is not. That
  # cancels the build of a commit that is now main, and the record of it is the
  # thing you want to point at later.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing here writes to the repo. Stated explicitly so a change to the
# organisation-wide default cannot silently widen it.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'schedule' || github.repository == 'SEPURI-SAI-KRISHNA/blame'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      # Exactly the hooks a contributor runs locally, from the same pinned
      # list. Two lists drift: one side reformats what the other rejects, and
      # an unpinned linter release turns an unrelated pull request red. The
      # revisions in .pre-commit-config.yaml are the pin that stops both.
      #
      # GH_TOKEN puts zizmor online, where it can ask GitHub whether a pinned
      # action still exists and whether it has an advisory. Locally, without a
      # token, it audits offline and says so.
      - name: Every check a contributor's hooks run
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx pre-commit run --all-files --show-diff-on-failure

      # Shell mistakes and bad expressions inside `run:` blocks, which YAML
      # parsing does not see and zizmor is not looking for.
      #
      # Downloaded and checksummed rather than run as an action: actionlint's
      # only PyPI packaging ships an sdist that needs a Go toolchain, and the
      # upstream installer is a curl piped into bash from a moving branch.
      # Four lines and a digest is less machinery than either.
      - name: Lint the workflow syntax
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o actionlint.tgz "$url"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum -c -
          tar xzf actionlint.tgz actionlint
          # actionlint runs shellcheck over every `run:` block when it can find
          # it and silently skips that half of its job when it cannot, which is
          # exactly how a shellcheck finding first reached CI having passed on
          # a machine without shellcheck installed. Fail loudly instead.
          shellcheck --version > /dev/null
          ./actionlint -color

  typecheck:
    # The package ships a py.typed marker, so its annotations are a promise to
    # every downstream type checker. This is what makes that promise honest.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'schedule' || github.repository == 'SEPURI-SAI-KRISHNA/blame'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Install
        run: |
          uv venv --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          uv pip install -e . mypy pandas-stubs pyright
      - run: mypy

      # Most people who consume a py.typed package are on pyright -- it is what
      # Pylance runs in VS Code. mypy alone was clean while pyright found 15
      # errors, several of them in query.py, which is what why() returns.
      # --pythonpath explicitly: pyright will otherwise pick an interpreter
      # that has no pandas in it and report 41 unresolved-import errors.
      - run: pyright --pythonpath "$PWD/.venv/bin/python" src/blame

      - name: A downstream project must actually get type checking
        # Guards the failure this job was added for: the marker shipped while
        # trace() returned an untyped value, so every check a caller wrote
        # against it passed vacuously.
        run: |
          mkdir -p /tmp/downstream && cd /tmp/downstream
          printf '[mypy]\n' > mypy.ini
          cat > wrong.py <<'PY'
          import blame
          import pandas as pd

          with blame.trace() as h:
              df = pd.DataFrame({"v": [1, 2, 3]})
              out = df[df.v > 1]

          h.run.why(row="not-an-int")
          h.run.nosuchmethod()
          PY
          if mypy --no-incremental --config-file=mypy.ini wrong.py; then
            echo "::error::downstream type checking found nothing; py.typed is not delivering"
            exit 1
          fi
          echo "downstream type checking works"

  test:
    # The os suffix appears only for the non-Linux legs, so the Linux check
    # names are byte-identical to what the branch ruleset already requires.
    name: pandas ${{ matrix.pandas || 'latest' }} / py ${{ matrix.python }}${{ matrix.os && format(' / {0}', matrix.os) || '' }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 25
    if: github.event_name != 'schedule' || github.repository == 'SEPURI-SAI-KRISHNA/blame'
    strategy:
      fail-fast: false
      matrix:
        # Only combinations that can exist: pandas 2.0 predates numpy 2, and
        # pandas 3.0 requires Python 3.11 or newer.
        include:
          - {python: "3.10", pandas: "2.0.3", extra: "numpy<2"}
          - {python: "3.11", pandas: "2.0.3", extra: "numpy<2"}
          - {python: "3.10", pandas: "2.2.3", extra: ""}
          - {python: "3.12", pandas: "2.2.3", extra: ""}
          - {python: "3.11", pandas: "3.0.5", extra: ""}
          # Coverage is measured on one pinned leg. Pinned rather than on
          # "latest", because an unpinned pandas can move which branches run
          # and turn the floor below into news about pandas.
          - {python: "3.12", pandas: "3.0.5", extra: "", coverage: true}
          - {python: "3.13", pandas: "3.0.5", extra: ""}
          - {python: "3.14", pandas: "3.0.5", extra: ""}
          # Unpinned: catches a new pandas release before users do.
          - {python: "3.12", pandas: "", extra: ""}
          # The tracer decides whose code a stack frame belongs to by comparing
          # filesystem paths as strings, which is the most platform-sensitive
          # thing in the package -- and the fix for #1 was written and checked
          # on Linux only. One representative leg each rather than a full
          # matrix: the question is whether the path logic holds, not whether
          # pandas 2.0.3 differs from 2.2.3 on a Mac.
          - {os: "windows-latest", python: "3.12", pandas: "", extra: ""}
          - {os: "macos-latest", python: "3.12", pandas: "", extra: ""}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install
        # bash on every platform: the Windows runner defaults to PowerShell,
        # where none of this parses. uv finds ./.venv on its own, so nothing
        # here has to put a platform-shaped path on PATH.
        shell: bash
        env:
          PANDAS: ${{ matrix.pandas }}
          EXTRA: ${{ matrix.extra }}
          PYTHON: ${{ matrix.python }}
        run: |
          uv venv --python "$PYTHON"
          uv pip install -e ".[dev]" matplotlib
          if [ -n "$PANDAS" ]; then
            uv pip install "pandas==$PANDAS"
          fi
          if [ -n "$EXTRA" ]; then
            uv pip install "$EXTRA"
          fi
          # Windows puts the interpreter in Scripts, not bin. Recorded as a
          # relative path so every later step can use it unchanged.
          PY=.venv/bin/python
          [ -x "$PY" ] || PY=.venv/Scripts/python.exe
          echo "PY=$PY" >> "$GITHUB_ENV"

      - name: Versions under test
        shell: bash
        run: |
          "$PY" -c "import sys, pandas, numpy, pyarrow; print(sys.version); print('pandas', pandas.__version__, '| numpy', numpy.__version__, '| pyarrow', pyarrow.__version__)"

      - name: Test
        if: ${{ !matrix.coverage }}
        shell: bash
        env:
          MPLBACKEND: Agg
        run: |
          "$PY" -m pytest

      - name: Test, and measure what the suite reaches
        # Nothing measured this, which is how cli.py sat at 0% -- every
        # subcommand, every argument, every error path, unexecuted by any test
        # while the suite was green.
        #
        # The floor is a ratchet: raise it when the number rises, never lower
        # it without saying why in the pull request. It sits one point below
        # the current figure so that a pandas patch release moving a branch
        # somewhere is not reported as a coverage regression; a real one, like
        # a module going untested, moves it by several points.
        if: ${{ matrix.coverage }}
        shell: bash
        env:
          MPLBACKEND: Agg
        run: |
          "$PY" -m pytest --cov=blame --cov-report=
          {
            echo "### Coverage"
            echo
            echo '```'
            "$PY" -m coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          "$PY" -m coverage html
          "$PY" -m coverage report --fail-under=89

      - name: The line-by-line report, when the floor is not met
        # Which lines are uncovered is the only useful thing to know at that
        # point, and it is not in the log.
        if: ${{ failure() && matrix.coverage }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 7

  sdist:
    # Downstream packagers -- Debian, conda-forge, Homebrew, Nix -- build from
    # the sdist and run its test suite during the build. Every other job here
    # runs from a full checkout, where .github/ and the community files exist,
    # so this is the only place a suite that cannot pass from an sdist shows up.
    #
    # It also guards a second regression for free: the unpacked directory is
    # named pandas_blame-<version>, which contains the string "pandas". That is
    # exactly the condition that once made the tracer record nothing at all.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'schedule' || github.repository == 'SEPURI-SAI-KRISHNA/blame'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv build --sdist

      - name: The sdist has to contain everything git tracks
        # The include list in pyproject.toml is maintained by hand, and a
        # hand-maintained list of files goes stale in one direction only: a new
        # doc simply does not ship, downstream packagers never receive it, and
        # every test still passes because tests do not read docs. It had
        # already happened -- SUPPORT.md was missing the first time this ran.
        #
        # No --inject-junk. It checks that stray files are not swept into the
        # sdist, which cannot happen here: hatchling is given an explicit list
        # of what to include, not a list of what to leave out.
        run: uvx check-sdist --installer uv

      - name: Unpack the sdist and run its own suite
        env:
          MPLBACKEND: Agg
        run: |
          mkdir -p /tmp/sd
          tar xzf dist/*.tar.gz -C /tmp/sd
          cd /tmp/sd/pandas_blame-*/
          pwd   # contains "pandas": the bug this also guards
          uv venv --python 3.12
          VIRTUAL_ENV=$PWD/.venv uv pip install -e ".[dev]" matplotlib
          ./.venv/bin/python -m pytest -q

  floor:
    # requires-python and the dependency lower bounds are claims. This is the
    # job that checks them, rather than trusting whatever pip happens to resolve.
    name: dependency floor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'schedule' || github.repository == 'SEPURI-SAI-KRISHNA/blame'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install the declared minimums
        run: |
          uv venv --python 3.10
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          uv pip install "pandas==2.0.0" "numpy==1.24.0" "pyarrow==14.0.0"
          uv pip install --no-deps -e .
          uv pip install pytest matplotlib "tomli>=2"

      - name: Versions under test
        run: python -c "import sys, pandas, numpy, pyarrow; print(sys.version); print('pandas', pandas.__version__, '| numpy', numpy.__version__, '| pyarrow', pyarrow.__version__)"

      - name: Test
        env:
          MPLBACKEND: Agg
        run: python -m pytest

  validation:
    # Real pandas code that nobody here wrote. Our own tests share our own
    # assumptions about what a pipeline looks like; the pandas getting-started
    # tutorials do not, which is why four defects turned up this way and are
    # listed in docs/validation.md. Each tutorial runs twice, traced and
    # untraced, and every frame it leaves behind is compared.
    name: pandas tutorials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'schedule' || github.repository == 'SEPURI-SAI-KRISHNA/blame'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Install
        run: |
          uv venv --python 3.12
          # matplotlib and openpyxl are the corpus's dependencies, not ours:
          # 04_plotting draws, and 02_read_write round-trips an .xlsx.
          uv pip install -e . matplotlib openpyxl

      - name: Run the corpus traced and untraced
        env:
          MPLBACKEND: Agg
        # Fetches the tutorials from the pinned pandas tag, so it needs network.
        run: ./.venv/bin/python validation/run.py

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'schedule' || github.repository == 'SEPURI-SAI-KRISHNA/blame'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv build
      - run: uvx twine check --strict dist/*

      - name: The wheel must work on its own
        run: |
          uv venv /tmp/wheelcheck
          VIRTUAL_ENV=/tmp/wheelcheck uv pip install dist/*.whl
          /tmp/wheelcheck/bin/python - <<'PY'
          import pandas as pd

          import blame

          df = pd.DataFrame({"a": [1, 2, 3, 4], "b": [10.0, 20, 30, 40]})
          with blame.trace(root="/tmp/ci-blame") as handle:
              kept = df[df.a > 1]
              out = kept.groupby("a", as_index=False)["b"].sum()

          rows = handle.run.why(row=0, target=out).sources[handle.run.sources[0]]
          assert rows.tolist() == [1], rows

          from blame.ui import _ASSET
          assert _ASSET.exists(), "the UI page is missing from the wheel"
          print("wheel ok")
          PY
          /tmp/wheelcheck/bin/blame --root /tmp/ci-blame steps

      - name: The whole suite has to pass against the wheel, with src/ deleted
        # Every other job installs with `uv pip install -e .`, which leaves
        # src/ on the path and importable whatever the wheel contains. That
        # hides an entire class of defect -- a module left out of the package
        # list, a missing data file, a bad __init__ export -- because the real
        # files are sitting there regardless.
        #
        # Deleting src/ is the part that makes this different from the smoke
        # test above: nothing can resolve to the source tree by accident, not
        # through a conftest, not through a stray sys.path entry.
        env:
          MPLBACKEND: Agg
        run: |
          set -- dist/*.whl
          test "$#" -eq 1 || { echo "expected one wheel, found $#"; exit 1; }
          VIRTUAL_ENV=/tmp/wheelcheck uv pip install "pandas-blame[dev] @ file://$PWD/$1" matplotlib
          rm -rf src
          /tmp/wheelcheck/bin/python -m pytest

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
